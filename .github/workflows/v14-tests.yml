name: v14 SQLite tests
on:
  push:
    branches: [dev/catalogo-sqlite]
  pull_request:
    branches: [master]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Compile Python
        run: python -m compileall -q app.py catalog_sqlite.py cast_bridge.py
