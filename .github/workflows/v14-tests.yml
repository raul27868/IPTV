name: IPTV Python tests
on:
  push:
    branches: [dev/catalogo-sqlite, dev/v15-catalogo-multimedia, dev/v15-xtream-probe]
  pull_request:
    branches: [master]
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Compile Python
        run: python -m compileall -q app.py catalog_sqlite.py media_classifier.py cast_bridge.py xtream_probe.py xtream_profiles.py xtream_stream.py xtream_browser.py
